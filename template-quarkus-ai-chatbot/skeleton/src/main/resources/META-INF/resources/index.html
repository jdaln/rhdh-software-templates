<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCD Suisse Romande - AI Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-branding">
                <div class="logo-container">
                    <svg class="kcd-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" fill="#326CE5" opacity="0.1"/>
                        <path d="M30 30 L50 20 L70 30 L70 50 L50 60 L30 50 Z" fill="#326CE5"/>
                        <circle cx="50" cy="40" r="8" fill="white"/>
                        <path d="M35 55 L50 50 L65 55" stroke="white" stroke-width="2" fill="none"/>
                    </svg>
                </div>
                <div class="header-text">
                    <h1>KCD Suisse Romande</h1>
                    <p class="subtitle">AI Chatbot Demo</p>
                </div>
            </div>
            <div class="header-actions">
                <nav class="header-links">
                    <a href="https://community.cncf.io/events/details/cncf-kcd-suisse-romande-presents-kcd-suisse-romande/" target="_blank" class="nav-link" title="KCD Suisse Romande">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                        KCD
                    </a>
                    <a href="https://quarkus.io" target="_blank" class="nav-link" title="Quarkus Project">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                        Quarkus
                    </a>
                    <a href="https://sessionize.com/view/rlq5we3p/GridSmart" target="_blank" class="nav-link" title="Conference Agenda">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        Agenda
                    </a>
                </nav>
                <button id="clearBtn" class="btn-secondary">Clear</button>
            </div>
        </header>
        
        <div class="conference-badge">
            <span class="badge-text">CERN • Dec 4-5, 2025</span>
        </div>
        
        <div id="chatContainer" class="chat-container">
            <div id="messages" class="messages"></div>
        </div>
        
        <div class="input-container">
            <textarea id="messageInput" placeholder="Type your message here..." rows="3"></textarea>
            <div class="button-group">
                <button id="sendBtn" class="btn-primary">Send</button>
                <button id="stopBtn" class="btn-secondary" disabled>Stop</button>
            </div>
        </div>
        
        <footer>
            <div class="footer-content">
                <span>Powered by <a href="https://quarkus.io" target="_blank" class="footer-link">Quarkus</a> & LangChain4j</span>
                <span class="footer-separator">•</span>
                <a href="https://community.cncf.io/events/details/cncf-kcd-suisse-romande-presents-kcd-suisse-romande/" target="_blank" class="footer-link">KCD Suisse Romande</a>
                <span class="footer-separator">•</span>
                <a href="https://sessionize.com/kcd-suisse-romande-2025" target="_blank" class="footer-link">Agenda</a>
            </div>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
