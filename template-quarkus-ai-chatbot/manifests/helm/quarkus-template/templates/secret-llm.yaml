{{- if and .Values.llm.enabled (not .Values.llm.secretName) }}
# LLM Secret - Only created when llm.secretName is not specified
# For pre-existing secrets, use:
# kubectl create secret generic ai-agent-secrets-llm \
#   --from-literal=LLM_API_BASE_URL=<url> \
#   --from-literal=LLM_API_KEY=<key> \
#   --from-literal=MODEL_NAME=<model>
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quarkus-template.name" . }}-llm
  labels:
    {{- include "quarkus-template.labels" . | nindent 4 }}
type: Opaque
stringData:
  LLM_API_BASE_URL: "{{ .Values.llm.apiBaseUrl }}"
  LLM_API_KEY: "{{ .Values.llm.apiKey }}"
  MODEL_NAME: "{{ .Values.llm.modelName }}"
{{- end }}

