# Default values for quarkus-template.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  pullPolicy: Always
  registry: 
  host: 
  organization: 
  name: 
  tag: 
  password: 

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true

  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: 
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

route:
  host: ""
  path: /

livenessProbe:
  httpGet:
    path: /q/health/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3

readinessProbe:
  httpGet:
    path: /q/health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# LLM Configuration for AI Agent
llm:
  enabled: true
  # Use a pre-existing secret (e.g., ai-agent-secrets-llm) or let Helm create one
  # If secretName is set, apiBaseUrl/apiKey/modelName are ignored and the secret must exist
  secretName: ""
  # These values are used when creating the secret via Helm
  apiBaseUrl: "${{values.llm_api_base_url}}"
  apiKey: "${{values.llm_api_key}}"
  modelName: "${{values.llm_model_name}}"

user:
