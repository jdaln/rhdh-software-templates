apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: quarkus-ai-chatbot-template
  title: Quarkus AI Chatbot
  description: Create an AI Chatbot service using Quarkus with LangChain4j, featuring streaming chat interface and LLM integration
  tags:
    - recommended
    - java
    - quarkus
    - maven
    - ai
    - langchain4j
    - llm
    - chatbot
    - streaming
spec:
  owner: rhdh
  type: service
  parameters:
    - title: Provide Information for Application
      required:
        - component_id
        - java_package_name
      properties:
        component_id:
          title: Name
          type: string
          description: Unique name of the component
          default: my-quarkus-chatbot
          ui:field: EntityNamePicker
          maxLength: 18
        group_id:
          title: Group Id
          type: string
          default: com.redhat.rhdh
          description: Maven Group Id
        artifact_id:
          title: Artifact Id
          type: string
          default: quarkus-ai-chatbot
          description: Maven Artifact Id
        java_package_name:
          title: Java Package Name
          default: com.redhat.rhdh
          type: string
          description: Name for the java package. eg (com.redhat.blah)
        description:
          title: Description
          type: string
          description: Help others understand what this AI chatbot is for.
          default: An AI Chatbot powered by Quarkus and LangChain4j with streaming support
    - title: AI/LLM Configuration
      required:
        - llm_api_base_url
        - llm_model_name
      properties:
        llm_api_base_url:
          title: LLM API Base URL
          type: string
          description: The base URL for the OpenAI-compatible LLM API
          default: https://deepseek-r1-qwen-14b-w4a16-maas-apicast-production.apps.prod.rhoai.rh-aiservices-bu.com/v1
        llm_api_key:
          title: LLM API Key
          type: string
          description: API key for authenticating with the LLM service
          ui:field: Secret
        llm_model_name:
          title: Model Name
          type: string
          description: The name of the LLM model to use
          default: r1-qwen-14b-w4a16
    - title: Provide Image Registry Information
      required:
        - image_registry
      properties:
        image_registry:
          title: Image Registry
          type: string
          enum:
            - OpenShift
            - Quay
      dependencies:
        image_registry:
          oneOf:
            - properties:
                image_registry:
                  enum:
                    - OpenShift
                image_host:
                  title: Image Host
                  type: string
                  description: Host for storing image
                  default: image-registry.openshift-image-registry.svc:5000
                image_tag:
                  title: Image Tag
                  default: latest
                  type: string
                  description: Build Image tag
            - properties:
                image_registry:
                  enum:
                    - Quay
                image_host:
                  title: Image Host
                  type: string
                  description: Host for storing image
                  default: quay.apps.cluster-qhv8j.qhv8j.sandbox3609.opentlc.com
                image_password:
                  title: Password
                  type: string
                  description: Your Quay password
                  ui:field: Secret
                image_tag:
                  title: Image Tag
                  default: latest
                  type: string
                  description: Build Image tag
    - title: Application repository Information
      required:
        - repo
      properties:
        repo:
          title: Repository Location
          type: object
          properties:
            host:
              title: Repo Host
              type: string
              description: Your SCM host
              default: gitlab-gitlab.apps.cluster-khqtq.khqtq.sandbox4789.opentlc.com
              enum:
                - gitlab-gitlab.apps.cluster-khqtq.khqtq.sandbox4789.opentlc.com

  steps:
    - id: template
      name: Fetch Skeleton + Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          namespace: ${{ parameters.component_id }}-dev
          group_id: ${{ parameters.group_id }}
          artifact_id: ${{ parameters.artifact_id }}
          java_package_name: ${{ parameters.java_package_name }}
          owner: ${{ user.entity.metadata.name }}
          cluster: apps.cluster-qhv8j.qhv8j.sandbox3609.opentlc.com
          host: ${{ parameters.repo.host }}
          destination: ${{ user.entity.metadata.name }}/${{ parameters.component_id }}
          port: 8080
          gitops_namespace: rhdh-gitops
          llm_api_base_url: ${{ parameters.llm_api_base_url }}
          llm_model_name: ${{ parameters.llm_model_name }}
        targetPath: ./${{ user.entity.metadata.name }}-${{parameters.component_id}}

    - id: publish
      name: Publish
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host }}?owner=${{ user.entity.metadata.name }}&repo=${{parameters.component_id}}"
        repoVisibility: public
        defaultBranch: main
        sourcePath: ./${{ user.entity.metadata.name }}-${{parameters.component_id}}

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

    - id: template-gitops-deployment
      name: Generating Deployment Resources
      action: fetch:template
      input:
        url: ./manifests
        copyWithoutTemplating: []
        values:
          component_id: ${{ parameters.component_id }}
          source_repository_gitops: https://${{ parameters.repo.host }}/${{ user.entity.metadata.name }}/${{parameters.component_id}}-gitops.git
          source_repository: https://${{ parameters.repo.host }}/${{ user.entity.metadata.name }}/${{parameters.component_id}}.git
          owner: ${{ user.entity.metadata.name }}
          namespace: ${{ user.entity.metadata.name }}-${{ parameters.component_id }}-dev
          image_registry: ${{ parameters.image_registry }}
          image_host: ${{ parameters.image_host }}
          image_organization: ${{ user.entity.metadata.name }}
          image_password: ${{ secrets.image_password }}
          image_name: ${{ parameters.component_id }}
          image_tag: ${{ parameters.image_tag }}
          gitops_namespace: rhdh-gitops
          gitops_project: default
          port: 8080
          cluster_subdomain: apps.cluster-qhv8j.qhv8j.sandbox3609.opentlc.com
          repository_host: ${{ parameters.repo.host }}
          llm_api_base_url: ${{ parameters.llm_api_base_url }}
          llm_api_key: ${{ secrets.llm_api_key }}
          llm_model_name: ${{ parameters.llm_model_name }}
        targetPath: ./${{ user.entity.metadata.name }}-${{parameters.component_id}}-gitops

    - id: publish-gitops
      name: Publishing to Resource Repository
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host }}?owner=${{ user.entity.metadata.name }}&repo=${{parameters.component_id}}-gitops"
        repoVisibility: public
        defaultBranch: main
        title: gitops resources for ${{ parameters.component_id }}
        description: gitops resources for ${{ parameters.component_id }}
        sourcePath: ./${{ user.entity.metadata.name }}-${{parameters.component_id}}-gitops

    - id: create-argocd-resources
      name: Create Argo CD Resources
      action: argocd:create-resources
      input:
        appName: ${{ user.entity.metadata.name }}-${{ parameters.component_id }}-bootstrap
        argoInstance: main
        namespace: rhdh-gitops
        repoUrl: https://${{ parameters.repo.host }}/${{ user.entity.metadata.name }}/${{ parameters.component_id }}-gitops.git
        path: 'argocd/'

  output:
    links:
      - title: Source Code Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open Component in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}

