version: '3.8'

services:
  development-tooling:
    image: quay.io/devfile/universal-developer-image:ubi8-277c10c
    volumes:
      - ..:/projects:cached
      - m2-cache:/home/user/.m2
    environment:
      - QUARKUS_HTTP_HOST=0.0.0.0
      - MAVEN_OPTS=-Dmaven.repo.local=/home/user/.m2/repository
      # PostgreSQL connection configuration for dev mode
      - QUARKUS_DATASOURCE_DEV_SERVICES_ENABLED=false
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/quarkusdb
      - QUARKUS_DATASOURCE_USERNAME=quarkus
      - QUARKUS_DATASOURCE_PASSWORD=quarkus
    command: sleep infinity
    depends_on:
      - postgres
    networks:
      - default

  postgres:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=quarkus
      - POSTGRES_PASSWORD=quarkus
      - POSTGRES_DB=quarkusdb
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - default

volumes:
  m2-cache:
  postgres-data:

networks:
  default:
    driver: bridge

