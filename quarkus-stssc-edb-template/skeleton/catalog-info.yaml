---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ${{values.name}}-system
  description: System for ${{values.name | dump}} application with PostgreSQL database
  tags:
    - quarkus
    - postgresql
    - edb
spec:
  owner: ${{values.owner | dump}}
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{values.name}}-postgresql
  description: PostgreSQL database managed by EDB Postgres for Kubernetes Operator 1.27.1
  annotations:
    backstage.io/kubernetes-id: ${{values.name}}-postgresql
    postgresql.k8s.enterprisedb.io/cluster: ${{values.name}}-postgresql
    postgresql.k8s.enterprisedb.io/operator-version: "1.27.1"
  tags:
    - postgresql
    - database
    - edb
    - managed-service
spec:
  type: database
  owner: ${{values.owner | dump}}
  system: ${{values.name}}-system
  lifecycle: production
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{values.name | dump}}
  {%- if values.description %}
  description: ${{values.description | dump}}
  {%- endif %}
  annotations:
    argocd/app-selector: tssc/gitops=${{values.name}}
    backstage.io/kubernetes-id: ${{values.name}}
    janus-idp.io/tekton: ${{values.name}}
    backstage.io/source-location: url:https://${{values.gitlabHost}}/${{values.destination}}
    backstage.io/techdocs-ref: url:https://${{values.gitlabHost}}/${{values.destination}}
    gitlab.com/project-slug: ${{values.destination}}
    quay.io/repository-slug: ${{values.quayDestination | dump}}
  tags:
    - java
    - quarkus
    - postgresql
  links:
    - url: https://devspaces.${{values.cluster}}/#https://${{values.gitlabHost}}/${{values.destination}}
      title: OpenShift Dev Spaces (VS Code)
      icon: web
    - url: https://devspaces.${{values.cluster}}/#https://${{values.gitlabHost}}/${{values.destination}}?che-editor=che-incubator/che-idea/latest
      title: OpenShift Dev Spaces (JetBrains IntelliJ)
      icon: web
spec:
  type: service
  lifecycle: production
  owner: ${{values.owner | dump}}
  system: ${{values.name}}-system
  dependsOn:
    - resource:${{values.name}}-postgresql
  providesApis:
    - ${{values.name | dump}}
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ${{values.name | dump}}
  {%- if values.description %}
  description: ${{values.description | dump}}
  {%- endif %}
spec:
  type: openapi
  lifecycle: production
  owner: ${{values.owner | dump}}
  definition:
    $text: ./openapi.yaml
