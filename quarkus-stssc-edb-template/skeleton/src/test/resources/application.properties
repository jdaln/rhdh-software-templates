# Test profile - disable database operations
%test.quarkus.flyway.migrate-at-start=false
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.datasource.devservices.enabled=false

# Use in-memory H2 database for tests (no external database needed)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=

