quarkus.http.port=${{values.port}}
quarkus.smallrye-openapi.store-schema-directory=./

# Database configuration
# In dev mode, PostgreSQL runs in a sidecar container (configured via .devfile.yaml)
# In production, these environment variables will be set by Kubernetes
quarkus.datasource.db-kind=postgresql
# Disable Dev Services - we're using a sidecar container in dev mode
quarkus.datasource.devservices.enabled=false
# Dev mode database configuration (uses environment variables from devfile)
# These will be overridden by environment variables if set
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:quarkus}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:quarkus}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/quarkusdb}
# Production-specific database configuration (only used when environment variables are set)
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
# Optimize connection pool for minimal resources
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.initial-size=1
quarkus.datasource.jdbc.idle-removal-interval=PT5M

# Hibernate configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Flyway configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
# Allow application to start even if Flyway migration fails (for testing)
quarkus.flyway.clean-at-start=false

# Health check configuration
quarkus.smallrye-health.root-path=/q/health
# Note: Liveness checks are configured to be independent of database connectivity
# This allows the application to start even if the database is temporarily unavailable

# JVM optimization for minimal resource usage (optimized for ~200Mi memory limit)
# Note: JVM args should be set via JAVA_OPTS environment variable in deployment, not here